<style>
.delete-body {
    text-align: center;
    padding: 1.5rem 1rem 0.5rem;
}
.delete-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #fef2f2;
    color: #ef4444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 1rem;
}
.delete-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--clr-text);
    margin-bottom: 6px;
}
.delete-desc {
    font-size: 13px;
    color: var(--clr-text-muted);
    margin-bottom: 0;
    line-height: 1.6;
}
.delete-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding: 1.25rem 1rem 1rem;
    border-top: 1px solid var(--clr-border);
    margin-top: 1.5rem;
}
.btn-del-cancel {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--clr-border);
    background: transparent;
    color: var(--clr-text-muted);
    cursor: pointer;
    transition: background 0.15s;
}
.btn-del-cancel:hover { background: var(--clr-bg); }
.btn-del-confirm {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: #ef4444;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
}
.btn-del-confirm:hover { background: #dc2626; transform: translateY(-1px); }
</style>

<div class="delete-body">
    <div class="delete-icon">
        <i class="bi bi-trash3"></i>
    </div>
    <div class="delete-title">Hapus Staff</div>
    <div class="delete-desc">
        Anda akan menghapus akun <strong>{{ staff.nama_lengkap }}</strong>.<br>
        <span style="color:#ef4444;">Tindakan ini tidak dapat dibatalkan.</span>
    </div>
</div>
<div class="delete-actions">
    <button class="btn-del-cancel" onclick="bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide()">
        Batal
    </button>
    <button class="btn-del-confirm" onclick="confirmDelete({{ staff.pk }})">
        <i class="bi bi-trash3 me-1"></i> Ya, Hapus
    </button>
</div>
