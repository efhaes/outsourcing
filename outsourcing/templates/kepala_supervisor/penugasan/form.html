{% extends 'kepala_supervisor/base_kepala.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">{{ page_title }}</h5>
    <a href="{% url 'kepala_penugasan_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Kembali
    </a>
</div>

<div class="card p-4">
    <form method="post">
        {% csrf_token %}
        
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label small text-muted">Supervisor</label>
                {{ form.supervisor }}
            </div>
            <div class="col-md-12">
                <label class="form-label small text-muted">Perusahaan</label>
                {{ form.perusahaan }}
            </div>
            <div class="col-md-12">
                <label class="form-label small text-muted">Jenis Jasa</label>
                {{ form.jenis_jasa }}
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">{{ action }}</button>
                <a href="{% url 'kepala_penugasan_list' %}" class="btn btn-secondary">Batal</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
