{% extends 'kepala_supervisor/base_kepala.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/kepala_spv/kepala.css' %}">
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">{{ page_title }}</h5>
    <a href="{% url 'kepala_area_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Kembali
    </a>
</div>

<div class="card p-4">
    <form method="post">
        {% csrf_token %}
        
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label small text-muted">Perusahaan</label>
                {{ form.perusahaan }}
            </div>
            <div class="col-md-12">
                <label class="form-label small text-muted">Nama Area</label>
                {{ form.nama_area }}
            </div>
            <div class="col-md-12">
                <label class="form-label small text-muted">Keterangan</label>
                {{ form.keterangan }}
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">{{ action }}</button>
                <a href="{% url 'kepala_area_list' %}" class="btn btn-secondary">Batal</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
