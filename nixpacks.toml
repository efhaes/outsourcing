[phases.setup]
aptPkgs = [
    "libcairo2-dev",
    "libpango1.0-dev",
    "libgdk-pixbuf2.0-dev",
    "libffi-dev",
    "pkg-config",
    "shared-mime-info",
]

[phases.build]
cmds = [
    "pip install -r requirements.txt",
    "python manage.py collectstatic --noinput",
    "python manage.py migrate"
]

[start]
cmd = "gunicorn unipacs.wsgi"