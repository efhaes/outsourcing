[build]
builder = "railpack"
buildCommand = "apt-get update && apt-get install -y libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev pkg-config shared-mime-info && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"

[deploy]
startCommand = "gunicorn unipacs.wsgi"
restartPolicyType = "on_failure"
